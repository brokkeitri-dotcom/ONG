<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Em Manutenção — ONG Lar Gatinhos Sorocaba</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f6f3fb;
      color: #2c2238;
    }

    .card {
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      border: 2px solid #6b3fa0;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(107, 63, 160, 0.12);
    }

    .badge {
      display: inline-block;
      background-color: #efe7fa;
      color: #6b3fa0;
      font-weight: bold;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #4a2574;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #554b63;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background-color: #6b3fa0;
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      padding: 12px 22px;
      border-radius: 8px;
    }

    .rodape {
      margin-top: 24px;
      font-size: 12px;
      color: #7c728a;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Atualização em andamento</span>
    <h1>Site em Manutenção</h1>
    <p>
      Estamos realizando melhorias no portal da <strong>ONG Lar Gatinhos Sorocaba</strong>
      para deixar tudo ainda mais organizado e completo. Voltamos em breve!
    </p>
    <a class="btn" href="https://instagram.com/largatinhossorocaba" target="_blank" rel="noopener noreferrer">
      Acompanhar no Instagram
    </a>
    <div class="rodape">
      ONG Lar Gatinhos Sorocaba • CNPJ: 61.953.983/0001-75
    </div>
  </main>
</body>
</html>
